<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirah Periods Dashboard</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f8bbd0">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="p1.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="p1.jpg">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: #faf5f8;
    --text: #4a4a4a;
    --pink: #f48fb1;
    --dark-pink: #d81b60;
    --purple: #ce93d8;
    --soft-purple: #9c27b0;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 12px;
    touch-action: pan-x pan-y pinch-zoom; 
  }

  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleUpFade {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .animate-header { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  .animate-chart { animation: scaleUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; opacity: 0; }
  .animate-table { animation: scaleUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; opacity: 0; }
  
  .dist-card { animation: slideUpFade 0.5s ease-out forwards; opacity: 0; }
  .card-days { animation-delay: 0.3s; }
  .card-weeks { animation-delay: 0.4s; }
  .card-months { animation-delay: 0.5s; }

  .header-card {
    background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 100%);
    border-radius: 20px;
    padding: 15px;
    color: #333;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(216, 27, 96, 0.15);
    position: relative;
    flex-shrink: 0;
    height: 32%;
  }

  .date-time-badge {
    position: absolute;
    top: 10px;
    right: 12px;
    background: rgba(255, 255, 255, 0.4); 
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: 600;
    color: #444;
    letter-spacing: 0.2px;
    backdrop-filter: blur(4px);
  }

  .main-title {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-top: 15px;
    color: var(--dark-pink);
  }
  
  .latest-date-badge {
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: #555;
    margin-bottom: 12px;
  }
  .latest-date-badge span {
    background: white;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
    color: var(--soft-purple);
  }
  .latest-date-badge .live-tag {
    display: inline-block;
    margin-left: 4px;
    background: #ffe0ec;
    color: var(--dark-pink);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 6px;
    font-weight: 600;
  }
  
  .cards-row { 
    display: flex; 
    width: 100%; 
    justify-content: space-between; 
    gap: 10px;
    padding: 0 5px;
  }
  
  .dist-card { 
    flex: 1;
    text-align: center; 
    border-radius: 16px;
    padding: 12px 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s ease;
  }

  .dist-card:hover { transform: translateY(-3px); }
  
  .card-days { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #fff; }
  .card-weeks { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: #fff; }
  .card-months { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #fff; }
  
  .dist-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }
  .dist-value { font-size: 22px; font-weight: 700; line-height: 1.1; margin-top: 2px; }
  .dist-sub { font-size: 9px; font-weight: 500; opacity: 0.85; margin-top: 2px; }

  .bottom-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    margin-top: 12px;
    height: 65%;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #fce4ec;
  }

  .chart-wrapper { flex: 1.2; padding: 12px; position: relative; display: flex; flex-direction: column; }
  
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-shrink: 0;
  }

  .chart-title { font-size: 11px; font-weight: 600; color: var(--soft-purple); }
  
  .filter-tabs {
    display: flex;
    gap: 5px;
    background: #f0f0f0;
    padding: 2px;
    border-radius: 8px;
  }
  .filter-tabs button {
    background: transparent;
    border: none;
    padding: 4px 8px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 9px;
    font-weight: 600;
    color: #777;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-tabs button.active {
    background: white;
    color: var(--dark-pink);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .canvas-scroll-wrapper {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    -webkit-overflow-scrolling: touch;
    padding-right: 5px;
  }

  .canvas-scroll-wrapper::-webkit-scrollbar { width: 4px; }
  .canvas-scroll-wrapper::-webkit-scrollbar-thumb { background: #f8bbd0; border-radius: 4px; }

  .table-container { flex: 1; }
  
  .scroll-area { 
    overflow-y: auto; 
    flex: 1; 
    -webkit-overflow-scrolling: touch;
    height: 100%;
  }

  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #f8bbd0; border-radius: 4px; }

  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
    text-align: center; 
  }
  
  th, td { 
    padding: 8px 2px; 
    border-bottom: 1px solid #fce4ec; 
    font-size: 9px; 
    word-wrap: break-word; 
    line-height: 1.3;
  }
  
  th:nth-child(1), td:nth-child(1) { width: 10%; text-align: center; } 
  th:nth-child(2), td:nth-child(2) { width: 35%; text-align: left; padding-left: 5px;} 
  th:nth-child(3), td:nth-child(3) { width: 15%; } 
  th:nth-child(4), td:nth-child(4) { width: 40%; text-align: right; padding-right: 8px;} 

  th { 
    background: #fff0f5; 
    font-weight: 600; 
    position: sticky; 
    top: 0; 
    color: var(--dark-pink); 
    z-index: 1; 
  }
  td { color: #555; }
  
  .highlight-row td { 
    color: var(--soft-purple); 
    font-weight: 700; 
    background: #faf5f8; 
  }

  @media (min-width: 768px) {
    body { padding: 30px; overflow: auto; }
    
    .header-card { height: auto; padding: 30px 40px; border-radius: 28px; }
    .main-title { font-size: 32px; margin-top: 10px; }
    .latest-date-badge { font-size: 16px; margin-bottom: 25px; }
    .date-time-badge { font-size: 12px; padding: 4px 12px; }
    
    .cards-row { gap: 20px; }
    .dist-card { padding: 20px; border-radius: 20px; }
    .dist-label { font-size: 14px; }
    .dist-value { font-size: 38px; }
    .dist-sub { font-size: 13px; }
    
    .bottom-section { 
      flex-direction: row; 
      height: 100%;
      gap: 20px;
      margin-top: 20px;
    }
    
    .chart-wrapper { flex: 5; padding: 20px; border-radius: 24px; }
    .table-container { flex: 5; border-radius: 24px; }
    
    .chart-title { font-size: 18px; }
    .filter-tabs button { font-size: 12px; padding: 6px 12px; }
    
    th, td { padding: 12px 10px; font-size: 14px; }
    th:nth-child(2), td:nth-child(2) { padding-left: 15px; }
    th:nth-child(4), td:nth-child(4) { padding-right: 20px; }
  }
</style>
</head>
<body>

  <div class="header-card animate-header">
    <div class="date-time-badge" id="liveDateTime">Loading...</div>
    
    <div class="main-title">Pirah Periods Dashboard 🌸</div>
    <div class="latest-date-badge">Latest Record: <span id="latestDate">...</span><span class="live-tag" id="liveTag"></span></div>
    
    <div class="cards-row">
      <div class="dist-card card-days">
        <div class="dist-label">Total Days</div>
        <div class="dist-value" id="statDays">-</div>
        <div class="dist-sub">Days Total</div>
      </div>
      
      <div class="dist-card card-weeks">
        <div class="dist-label">Total Weeks</div>
        <div class="dist-value" id="statWeeks">-</div>
        <div class="dist-sub">Weeks Total</div>
      </div>
      
      <div class="dist-card card-months">
        <div class="dist-label">Total Months</div>
        <div class="dist-value" id="statMonths">-</div>
        <div class="dist-sub">Months Total</div>
      </div>
    </div>
  </div>

  <div class="bottom-section">
    
    <div class="card chart-wrapper animate-chart">
      <div class="chart-header">
        <div class="chart-title" id="chartTitleDisplay">Cycle Durations</div>
        <div class="filter-tabs">
          <button onclick="changeView('daily')" id="btn-daily" class="active">Daily</button>
          <button onclick="changeView('weekly')" id="btn-weekly">Weekly</button>
          <button onclick="changeView('monthly')" id="btn-monthly">Monthly</button>
        </div>
      </div>
      
      <div class="canvas-scroll-wrapper" id="chartScrollArea">
        <div id="canvasContainer" style="position: relative; width: 100%; height: 100%;">
          <canvas id="barChart"></canvas>
        </div>
      </div>
    </div>

    <div class="card table-container animate-table">
      <div class="scroll-area">
        <table>
          <thead>
            <tr>
              <th>Sr#</th>
              <th id="th-date">Date</th>
              <th id="th-metric">Days</th>
              <th id="th-duration">Duration</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  // ================== 1. PKT TIME HELPERS ==================
  const PKT_OFFSET_MS = 5 * 60 * 60 * 1000; // UTC+5

  function getNowPKT() {
    const now = new Date();
    return new Date(now.getTime() + now.getTimezoneOffset() * 60000 + PKT_OFFSET_MS);
  }

  function getTodayPKTMidnight() {
    const pkt = getNowPKT();
    pkt.setHours(0, 0, 0, 0);
    return pkt;
  }

  // Live clock (formatted in PKT)
  function updateLiveDateTime() {
    const now = getNowPKT();
    const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
                      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
    const formatted = now.toLocaleString('en-US', options).replace(/,(\s\d{4})/, '$1');
    document.getElementById('liveDateTime').innerText = formatted + ' (PKT)';
  }

  // ================== 2. STATE ==================
  let csvData = [];
  let currentView = 'daily';
  let chartInstance = null;
  let liveDays = 0; // dynamic days-since-latest-record (PKT)

  const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQtnlGwD2UMLP8U_xNHb0vs7NP75Ikkk-G4xQNbTvjyHpymzsOw5qUbYU3h_9uxEDnOWmrCrfkOffWz/pub?gid=501812835&single=true&output=csv";

  // ================== 3. DATE PARSER (M/D/YYYY) ==================
  function parseMyDate(dateString) {
    if (!dateString) return null;
    dateString = dateString.trim();
    const parts = dateString.split('/');
    if (parts.length === 3) {
      const month = parseInt(parts[0], 10);
      const day = parseInt(parts[1], 10);
      let year = parseInt(parts[2], 10);
      if (year < 100) year += 2000;
      return new Date(year, month - 1, day);
    }
    return new Date(dateString);
  }

  function getWeekdayDate(dateString) {
    const dateObj = parseMyDate(dateString);
    if (!dateObj || isNaN(dateObj)) return dateString;
    return dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Days between a record date and today's PKT midnight
  function daysFromRecordToTodayPKT(dateString) {
    const rec = parseMyDate(dateString);
    if (!rec || isNaN(rec)) return 0;
    rec.setHours(0, 0, 0, 0);
    const today = getTodayPKTMidnight();
    const diff = Math.floor((today - rec) / (1000 * 60 * 60 * 24));
    return diff < 0 ? 0 : diff;
  }

  // ================== 4. FETCH & PARSE CSV ==================
  async function fetchAndParseCSV() {
    try {
      const response = await fetch(csvUrl);
      const text = await response.text();
      const rows = text.split(/\r?\n/).map(row => row.split(','));

      let dataStartIndex = 0;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i].some(cell => cell && cell.includes("Periods Date"))) {
          dataStartIndex = i + 1;
          break;
        }
      }

      const newData = [];
      for (let i = dataStartIndex; i < rows.length; i++) {
        const cols = rows[i];
        if (!cols || cols.length < 8 || !cols[1] || cols[1].trim() === '') continue;

        const dateStr = cols[1].trim();
        const durationStr = cols[4] ? cols[4].trim() : '';
        const totalDays = parseInt(cols[6]);
        const totalMonths = parseInt(cols[7]);
        const totalWeeks = parseInt(cols[8]);

        if (isNaN(totalDays)) continue;

        newData.push({
          date: dateStr,
          days: totalDays,
          weeks: totalWeeks,
          months: totalMonths,
          duration: durationStr
        });
      }

      csvData = newData.reverse();
      updateDashboardUI();
    } catch (error) {
      console.error("Error fetching CSV:", error);
    }
  }

  // ================== 5. DASHBOARD UPDATE ==================
  function updateDashboardUI() {
    if (csvData.length === 0) return;

    const latest = csvData[0];

    // Dynamic days since latest record, based on current PKT date
    liveDays = daysFromRecordToTodayPKT(latest.date);
    const liveWeeks = Math.floor(liveDays / 7);
    const liveMonths = Math.floor(liveDays / 30);

    // Latest record badge — date + "X days ago"
    document.getElementById('latestDate').innerText = getWeekdayDate(latest.date);
    document.getElementById('liveTag').innerText = `• ${liveDays} day${liveDays === 1 ? '' : 's'} ago`;

    // Top cards → live values
    document.getElementById('statDays').innerText = liveDays;
    document.getElementById('statWeeks').innerText = liveWeeks;
    document.getElementById('statMonths').innerText = liveMonths;

    changeView(currentView);
  }

  // ================== 6. VIEW SWITCH ==================
  function changeView(view) {
    currentView = view;

    document.querySelectorAll('.filter-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${view}`).classList.add('active');

    const titles = { daily: 'Cycle Durations', weekly: 'Weekly Breakdown', monthly: 'Monthly Breakdown' };
    document.getElementById('chartTitleDisplay').innerText = titles[view];

    const thMetric = document.getElementById('th-metric');
    if (view === 'daily') thMetric.innerText = 'Days';
    if (view === 'weekly') thMetric.innerText = 'Weeks';
    if (view === 'monthly') thMetric.innerText = 'Months';

    renderBarChartAndTable(view);
  }

  // ================== 7. RENDER CHART + TABLE ==================
  function renderBarChartAndTable(viewType) {
    if (csvData.length === 0) return;

    const ctx = document.getElementById('barChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    // For chart/table: first row uses LIVE value based on PKT today.
    // Other rows use the static sheet values.
    const liveWeeks = Math.floor(liveDays / 7);
    const liveMonths = Math.floor(liveDays / 30);

    const labels = csvData.map(d => getWeekdayDate(d.date));
    const dataPoints = csvData.map((d, i) => {
      if (i === 0) {
        if (viewType === 'daily') return liveDays;
        if (viewType === 'weekly') return liveWeeks;
        if (viewType === 'monthly') return liveMonths;
      }
      if (viewType === 'daily') return d.days;
      if (viewType === 'weekly') return d.weeks;
      return d.months;
    });

    let unit = ' d';
    if (viewType === 'weekly') unit = ' w';
    if (viewType === 'monthly') unit = ' mo';

    // --- TABLE ---
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    csvData.forEach((row, index) => {
      const tr = document.createElement('tr');
      if (index === 0) tr.classList.add('highlight-row');

      let metricValue = row.days;
      if (viewType === 'weekly') metricValue = row.weeks;
      if (viewType === 'monthly') metricValue = row.months;

      if (index === 0) {
        // live dynamic value on the first row
        if (viewType === 'daily') metricValue = liveDays;
        if (viewType === 'weekly') metricValue = liveWeeks;
        if (viewType === 'monthly') metricValue = liveMonths;
      }

      // Duration column for the first row shows "Live" indicator for clarity
      const durationCell = (index === 0)
        ? `${row.duration} <span style="font-size:8px;color:#d81b60;font-weight:600;">(LIVE)</span>`
        : row.duration;

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${getWeekdayDate(row.date)}</td>
        <td>${metricValue}</td>
        <td>${durationCell}</td>
      `;
      tbody.appendChild(tr);
    });

    // --- CHART HEIGHT ---
    const requiredHeight = (csvData.length * 35) + 50;
    document.getElementById('canvasContainer').style.height = `${requiredHeight}px`;

    // --- CHART ---
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          data: dataPoints,
          backgroundColor: labels.map((_, i) => i === 0 ? '#d81b60' : '#f8bbd0'),
          borderRadius: 8,
          borderSkipped: false,
          barThickness: 20,
          hoverBackgroundColor: '#ad1457'
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 30 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(255, 255, 255, 0.95)',
            titleColor: '#d81b60',
            bodyColor: '#333',
            borderColor: '#f8bbd0',
            borderWidth: 1,
            padding: 10,
            displayColors: false
          }
        },
        scales: {
          x: { beginAtZero: true, display: false, grid: { display: true, color: '#faf5f8', drawTicks: false } },
          y: {
            grid: { display: false },
            ticks: { font: { size: 11, family: 'Poppins', weight: '600' }, color: '#555' }
          }
        },
        animation: {
          duration: 1000,
          easing: 'easeOutQuart',
          onComplete: function() {
            const chartInstance = this;
            const ctx2 = chartInstance.ctx;
            ctx2.font = 'bold 11px Poppins';
            ctx2.textAlign = 'left';
            ctx2.textBaseline = 'middle';

            this.data.datasets.forEach(function(dataset, i) {
              const meta = chartInstance.getDatasetMeta(i);
              meta.data.forEach(function(bar, index) {
                const data = dataset.data[index];
                ctx2.fillStyle = index === 0 ? '#d81b60' : '#666';
                ctx2.fillText(data + unit, bar.x + 8, bar.y);
              });
            });
          }
        }
      }
    });
  }

  // ================== 8. PKT MIDNIGHT ROLLOVER ==================
  function scheduleMidnightPKTRefresh() {
    const nowPKT = getNowPKT();
    const nextMidnight = new Date(nowPKT);
    nextMidnight.setHours(24, 0, 1, 0); // next day 00:00:01 PKT
    const msUntil = nextMidnight - nowPKT;
    setTimeout(() => {
      fetchAndParseCSV();          // re-compute liveDays at new day
      scheduleMidnightPKTRefresh();
    }, msUntil);
  }

  // ================== 9. INIT ==================
  updateLiveDateTime();
  setInterval(updateLiveDateTime, 1000);

  // Recalculate "days since" every 60s (covers any clock drift)
  setInterval(() => {
    if (csvData.length) updateDashboardUI();
  }, 60000);

  fetchAndParseCSV();
  setInterval(fetchAndParseCSV, 30000);
  scheduleMidnightPKTRefresh();
</script>
</body>
</html>
