<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirah Periods Dashboard</title>

<!-- PWA Manifest & Meta -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f8bbd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pirah">

<!-- Favicon using your uploaded p1.jpg -->
<link rel="icon" href="p1.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="p1.jpg">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: #faf5f8;
    --text: #4a4a4a;
    --pink: #f48fb1;
    --dark-pink: #d81b60;
    --purple: #ce93d8;
    --soft-purple: #9c27b0;
    --card-bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 12px;
    touch-action: pan-x pan-y pinch-zoom; 
  }

  /* --- ANIMATIONS --- */
  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleUpFade {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.8) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .animate-header { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  .animate-chart { animation: scaleUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; opacity: 0; }
  .animate-table { animation: scaleUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; opacity: 0; }
  
  .dist-card { animation: slideUpFade 0.5s ease-out forwards; opacity: 0; }
  .card-days { animation-delay: 0.3s; }
  .card-weeks { animation-delay: 0.4s; }
  .card-months { animation-delay: 0.5s; }

  /* --- TOP HEADER --- */
  .header-card {
    background: linear-gradient(135deg, #f8bbd0 0%, #e1bee7 100%);
    border-radius: 20px;
    padding: 15px;
    color: #333;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 8px 25px rgba(216, 27, 96, 0.15);
    position: relative;
    flex-shrink: 0;
    height: 32%;
  }

  .date-badge {
    position: absolute;
    top: 12px;
    right: 15px;
    background: rgba(255, 255, 255, 0.25); 
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    color: rgba(0, 0, 0, 0.5);
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
  }

  .main-title {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-top: 15px;
    color: var(--dark-pink);
  }
  
  .latest-date-badge {
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: #555;
    margin-bottom: 12px;
  }
  .latest-date-badge span {
    background: white;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
    color: var(--soft-purple);
  }
  
  /* --- CARDS ROW --- */
  .cards-row { 
    display: flex; 
    width: 100%; 
    justify-content: space-between; 
    gap: 10px;
    padding: 0 5px;
  }
  
  .dist-card { 
    flex: 1;
    text-align: center; 
    border-radius: 16px;
    padding: 12px 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s ease;
  }

  .dist-card:hover { transform: translateY(-3px); }
  
  .card-days { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: #fff; }
  .card-weeks { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); color: #fff; }
  .card-months { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #fff; }
  
  .dist-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }
  .dist-value { font-size: 22px; font-weight: 700; line-height: 1.1; margin-top: 2px; }
  .dist-sub { font-size: 9px; font-weight: 500; opacity: 0.85; margin-top: 2px; }

  /* --- BOTTOM SECTION --- */
  .bottom-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
    margin-top: 12px;
    height: 65%;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #fce4ec;
    position: relative;
  }

  /* Chart Container */
  .chart-wrapper { flex: 1.2; padding: 12px; position: relative; }
  
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 5px;
  }

  .chart-title { font-size: 12px; font-weight: 600; color: var(--soft-purple); }
  
  /* Flower Filter Button */
  .filter-btn {
    background: #fce4ec;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 2px 5px rgba(216, 27, 96, 0.1);
    transition: transform 0.2s;
  }
  .filter-btn:active { transform: scale(0.9); }

  /* Popup Menu */
  .popup-menu {
    position: absolute;
    top: 45px;
    right: 15px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    display: none;
    flex-direction: column;
    z-index: 10;
    border: 1px solid #fce4ec;
    overflow: hidden;
    animation: popIn 0.2s ease-out forwards;
  }
  .popup-menu.active { display: flex; }
  .popup-menu button {
    background: none;
    border: none;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: background 0.2s;
  }
  .popup-menu button:hover { background: #faf5f8; }
  .popup-menu button.active-filter { color: var(--dark-pink); font-weight: 700; background: #fff0f5; }

  /* Table Container */
  .table-container { flex: 1; }
  
  .scroll-area { 
    overflow-y: auto; 
    flex: 1; 
    -webkit-overflow-scrolling: touch;
    height: 100%;
  }

  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #f8bbd0; border-radius: 4px; }

  /* Table formatting (Date, Days, Duration only) */
  table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; 
    text-align: center; 
  }
  
  th, td { 
    padding: 8px 4px; 
    border-bottom: 1px solid #fce4ec; 
    font-size: 10px; 
    word-wrap: break-word; 
    line-height: 1.3;
  }
  
  /* Adjusted Column Widths for 3 columns */
  th:nth-child(1), td:nth-child(1) { width: 40%; text-align: left; padding-left: 12px;}
  th:nth-child(2), td:nth-child(2) { width: 20%; } 
  th:nth-child(3), td:nth-child(3) { width: 40%; text-align: right; padding-right: 12px;} 

  th { 
    background: #fff0f5; 
    font-weight: 600; 
    position: sticky; 
    top: 0; 
    color: var(--dark-pink); 
    z-index: 1; 
  }
  td { color: #555; }
  
  .highlight-row td { 
    color: var(--dark-pink); 
    font-weight: 600; 
    background: #fff8fb; 
  }

  /* --- DESKTOP LAYOUT --- */
  @media (min-width: 768px) {
    body { padding: 30px; overflow: auto; }
    
    .header-card { height: auto; padding: 30px 40px; border-radius: 28px; }
    .main-title { font-size: 32px; margin-top: 10px; }
    .latest-date-badge { font-size: 16px; margin-bottom: 25px; }
    
    .cards-row { gap: 20px; }
    .dist-card { padding: 20px; border-radius: 20px; }
    .dist-label { font-size: 14px; }
    .dist-value { font-size: 38px; }
    .dist-sub { font-size: 13px; }
    
    .bottom-section { 
      flex-direction: row; 
      height: 100%;
      gap: 20px;
      margin-top: 20px;
    }
    
    .chart-wrapper { flex: 5; padding: 20px; border-radius: 24px; }
    .table-container { flex: 5; border-radius: 24px; }
    
    .chart-title { font-size: 18px; }
    .filter-btn { width: 36px; height: 36px; font-size: 18px; }
    .popup-menu button { font-size: 14px; padding: 12px 24px; }
    
    th, td { padding: 12px 10px; font-size: 14px; }
    th:nth-child(1), td:nth-child(1) { padding-left: 20px; }
    th:nth-child(3), td:nth-child(3) { padding-right: 20px; }
  }
</style>
</head>
<body>

  <div class="header-card animate-header">
    <div class="date-badge" id="currentDateBadge">Loading...</div>
    
    <div class="main-title">Pirah Periods Dashboard 🌸</div>
    <div class="latest-date-badge">Latest Record: <span id="latestDate">...</span></div>
    
    <div class="cards-row">
      <div class="dist-card card-days">
        <div class="dist-label">Total Days</div>
        <div class="dist-value" id="statDays">-</div>
        <div class="dist-sub">Days Total</div>
      </div>
      
      <div class="dist-card card-weeks">
        <div class="dist-label">Total Weeks</div>
        <div class="dist-value" id="statWeeks">-</div>
        <div class="dist-sub">Weeks Total</div>
      </div>
      
      <div class="dist-card card-months">
        <div class="dist-label">Total Months</div>
        <div class="dist-value" id="statMonths">-</div>
        <div class="dist-sub">Months Total</div>
      </div>
    </div>
  </div>

  <div class="bottom-section">
    
    <!-- CHART -->
    <div class="card chart-wrapper animate-chart">
      <div class="chart-header">
        <div class="chart-title" id="chartTitleDisplay">Recent Cycle Durations</div>
        <button class="filter-btn" id="filterBtn">🌸</button>
      </div>
      
      <!-- Filter Popup -->
      <div class="popup-menu" id="filterMenu">
        <button onclick="changeView('daily')" id="btn-daily" class="active-filter">Daily (Recent Days)</button>
        <button onclick="changeView('weekly')" id="btn-weekly">Weekly View</button>
        <button onclick="changeView('monthly')" id="btn-monthly">Monthly View</button>
      </div>

      <canvas id="barChart"></canvas>
    </div>

    <!-- TABLE -->
    <div class="card table-container animate-table">
      <div class="scroll-area">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Days</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  // --- REGISTER SERVICE WORKER ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(registration => console.log('SW Registered'))
        .catch(error => console.log('SW Failed', error));
    });
  }

  // --- 1. CURRENT DATE ---
  function setCurrentDate() {
    const options = { month: 'short', day: 'numeric', year: 'numeric' };
    const today = new Date().toLocaleDateString('en-US', options);
    document.getElementById('currentDateBadge').innerText = today;
  }
  setCurrentDate();

  // --- 2. YOUR EXACT CSV DATA ---
  const csvData = [
    { date: "Oct 9, 2026", days: 9, weeks: 1, months: 0, duration: "0 Months 9 Days" },
    { date: "Sep 8, 2026", days: 31, weeks: 4, months: 1, duration: "1 Month 1 Day" },
    { date: "Aug 6, 2026", days: 33, weeks: 4, months: 1, duration: "1 Month 3 Days" },
    { date: "Jul 2, 2026", days: 35, weeks: 5, months: 1, duration: "1 Month 5 Days" },
    { date: "May 25, 2026", days: 38, weeks: 5, months: 1, duration: "1 Month 8 Days" },
    { date: "Apr 21, 2026", days: 34, weeks: 4, months: 1, duration: "1 Month 4 Days" },
    { date: "Mar 16, 2026", days: 36, weeks: 5, months: 1, duration: "1 Month 6 Days" },
    { date: "Feb 11, 2026", days: 33, weeks: 4, months: 1, duration: "1 Month 3 Days" },
    { date: "Jan 9, 2026", days: 33, weeks: 4, months: 1, duration: "1 Month 3 Days" },
    { date: "Dec 9, 2025", days: 31, weeks: 4, months: 1, duration: "1 Month 1 Day" },
    { date: "Oct 31, 2025", days: 39, weeks: 5, months: 1, duration: "1 Month 9 Days" },
    { date: "Sep 28, 2025", days: 33, weeks: 4, months: 1, duration: "1 Month 3 Days" },
    { date: "Aug 27, 2025", days: 32, weeks: 4, months: 1, duration: "1 Month 2 Days" },
    { date: "Jul 11, 2025", days: 47, weeks: 6, months: 1, duration: "1 Month 17 Days" },
    { date: "Apr 22, 2025", days: 80, weeks: 11, months: 2, duration: "2 Months 20 Days" },
    { date: "Jul 16, 2024", days: 280, weeks: 40, months: 9, duration: "9 Months 10 Days" },
    { date: "Mar 22, 2024", days: 116, weeks: 16, months: 3, duration: "3 Months 26 Days" },
    { date: "Jul 8, 2023", days: 258, weeks: 36, months: 8, duration: "8 Months 18 Days" },
    { date: "May 6, 2023", days: 63, weeks: 9, months: 2, duration: "2 Months 3 Days" },
    { date: "Apr 1, 2023", days: 35, weeks: 5, months: 1, duration: "1 Month 5 Days" },
    { date: "Feb 19, 2023", days: 41, weeks: 5, months: 1, duration: "1 Month 11 Days" }
  ];

  // --- 3. UPDATE UI & TABLE ---
  function initDashboard() {
    const latest = csvData[0];

    document.getElementById('latestDate').innerText = latest.date;
    document.getElementById('statDays').innerText = latest.days;
    document.getElementById('statWeeks').innerText = latest.weeks;
    document.getElementById('statMonths').innerText = latest.months;

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    // ONLY showing Date, Days, and Duration as requested
    csvData.forEach((row, index) => {
      const tr = document.createElement('tr');
      if (index === 0) tr.classList.add('highlight-row'); 
      
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${row.days}</td>
        <td>${row.duration}</td>
      `;
      tbody.appendChild(tr);
    });

    // Initial Chart Render
    renderBarChart('daily');
  }

  // --- 4. FILTER MENU LOGIC ---
  const filterBtn = document.getElementById('filterBtn');
  const filterMenu = document.getElementById('filterMenu');

  filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterMenu.classList.toggle('active');
  });

  // Close menu when clicking outside
  document.addEventListener('click', (e) => {
    if (!filterMenu.contains(e.target) && e.target !== filterBtn) {
      filterMenu.classList.remove('active');
    }
  });

  // Change View Function
  let currentView = 'daily';
  let chartInstance = null;

  function changeView(view) {
    currentView = view;
    filterMenu.classList.remove('active');

    // Update button styles
    document.querySelectorAll('.popup-menu button').forEach(b => b.classList.remove('active-filter'));
    document.getElementById(`btn-${view}`).classList.add('active-filter');

    // Update Chart Title
    const titles = {
      'daily': 'Recent Cycle Durations (Days)',
      'weekly': 'Weekly Duration Breakdown',
      'monthly': 'Monthly Duration Breakdown'
    };
    document.getElementById('chartTitleDisplay').innerText = titles[view];

    renderBarChart(view);
  }

  // --- 5. RENDER BAR CHART (TOP TO BOTTOM) ---
  function renderBarChart(viewType) {
    const ctx = document.getElementById('barChart').getContext('2d');
    
    if (chartInstance) {
      chartInstance.destroy();
    }

    let chartData = [];
    let labels = [];
    let dataPoints = [];
    let unit = ' d';

    if (viewType === 'daily') {
      // Last 8 recent dates
      chartData = csvData.slice(0, 8);
      labels = chartData.map(d => d.date);
      dataPoints = chartData.map(d => d.days);
    } 
    else if (viewType === 'weekly') {
      // Show recent weeks tracking
      chartData = csvData.slice(0, 10);
      labels = chartData.map(d => d.date);
      dataPoints = chartData.map(d => d.weeks);
      unit = ' w';
    } 
    else if (viewType === 'monthly') {
      // Show recent months tracking
      chartData = csvData.slice(0, 8);
      labels = chartData.map(d => d.date);
      dataPoints = chartData.map(d => d.months);
      unit = ' mo';
    }

    // To make it top-to-bottom descending, we DO NOT reverse the data, 
    // Chart.js draws horizontal bars from top to bottom based on array order.
    // Array is already newest to oldest (descending).

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels, 
        datasets: [{
          data: dataPoints,
          backgroundColor: labels.map((_, i) => i === 0 ? '#d81b60' : '#f8bbd0'), 
          borderRadius: 6, 
          borderSkipped: false,
          barThickness: 16, 
          hoverBackgroundColor: '#ad1457'
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 35 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(255, 255, 255, 0.95)',
            titleColor: '#d81b60',
            bodyColor: '#333',
            borderColor: '#f8bbd0',
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              label: function(context) { 
                return context.raw + unit + (viewType === 'daily' ? 'ays' : (viewType === 'weekly' ? 'eeks' : 'onths')); 
              }
            }
          }
        },
        scales: {
          x: { beginAtZero: true, display: false },
          y: { 
            grid: { display: false },
            ticks: { 
              font: { size: 11, family: 'Poppins', weight: '600' }, 
              color: '#666' 
            }
          }
        },
        animation: {
          duration: 1000,
          easing: 'easeOutQuart',
          onComplete: function() {
            const chartInstance = this;
            const ctx = chartInstance.ctx;
            ctx.font = 'bold 11px Poppins';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            this.data.datasets.forEach(function(dataset, i) {
              const meta = chartInstance.getDatasetMeta(i);
              meta.data.forEach(function(bar, index) {
                const data = dataset.data[index];
                // The top bar (index 0) is the newest
                ctx.fillStyle = index === 0 ? '#d81b60' : '#888';
                ctx.fillText(data + unit, bar.x + 8, bar.y);
              });
            });
          }
        }
      }
    });
  }

  initDashboard();

</script>
</body>
</html>
